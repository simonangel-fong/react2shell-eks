---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-api-conf
  namespace: secure-backend
data:
  default.conf: |
    server {
        listen 8080;

        location /api/v1/healthz {
            default_type application/json;
            return 200 '{"status":"healthy","message":"Service is running"}';
        }

        location /api/v1/users {
            default_type application/json;
            return 200 '[{"id":1,"name":"Alice"},{"id":2,"name":"Bob"}]';
        }

        location / {
            return 404 '{"error":"Not Found"}';
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: secure-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      # pod-level hardening (non-root, seccomp)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx-unprivileged runs as uid 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config-volume
          configMap:
            name: backend-api-conf
        # nginx-unprivileged needs writable temp/run dirs under read-only rootfs
        - name: tmp
          emptyDir: {}
      containers:
        - name: nginx
          # unprivileged nginx: listens on 8080 as non-root (can't bind :80)
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 64m
              memory: 128Mi
            limits:
              cpu: 128m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: secure-backend
  labels:
    app: backend-api
spec:
  selector:
    app: backend-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
