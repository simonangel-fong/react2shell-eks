# Kyverno image policy — rejects insecure images at admission.
# Needs the Kyverno CRDs first, so sync it after platform-kyverno.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: image-policy
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after kyverno (wave 0)
spec:
  validationFailureAction: Enforce        # block, don't just audit
  background: false
  rules:
    # 1) registry must be docker.io
    - name: require-docker-registry
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "images must come from docker.io"
        pattern:
          spec:
            containers:
              - name: "*"
                image: "docker.io/*"

    # 2) must not use the :latest tag
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "image must not use the :latest tag"
        pattern:
          spec:
            containers:
              - name: "*"
                image: "!*:latest"

    # 3) must be explicitly tagged (reject images with no tag)
    - name: require-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "image must have an explicit tag"
        pattern:
          spec:
            containers:
              - name: "*"
                image: "*:*"

    # 4) must not use the known-vulnerable tag
    - name: block-vulnerable-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "the :insecure image tag is forbidden"
        pattern:
          spec:
            containers:
              - name: "*"
                image: "!*:insecure"
