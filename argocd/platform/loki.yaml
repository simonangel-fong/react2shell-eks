# Loki — log store for Falco events (fed by Falcosidekick, queried by Grafana).
# SingleBinary + filesystem: lab-grade, fits kind (no object storage / caches).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      releaseName: loki
      values: |
        # single-process mode, 1 replica, filesystem storage
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          # silence the "structured metadata requires v13/tsdb" ingester limit
          limits_config:
            allow_structured_metadata: true
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 2Gi
        # disable everything not needed on a single-node lab
        backend:   { replicas: 0 }
        read:      { replicas: 0 }
        write:     { replicas: 0 }
        gateway:   { enabled: false }
        cache:
          chunksCache:   { enabled: false }
          resultsCache:  { enabled: false }
        lokiCanary:      { enabled: false }
        test:            { enabled: false }
        monitoring:
          selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
        chunksCache:   { enabled: false }
        resultsCache:  { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
