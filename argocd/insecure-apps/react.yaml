---
apiVersion: v1
kind: Namespace
metadata:
  name: react
---
# Container level crown jewel
apiVersion: v1
kind: Secret
metadata:
  name: container-secret
  namespace: react
type: Opaque
stringData:
  password: "CoNtAinEr-sEcRet-InsECurE"
---
# insecure app: react2shell
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react2shell
  namespace: react
  labels:
    app: react2shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react2shell
  template:
    metadata:
      labels:
        app: react2shell
    spec:
      serviceAccountName: react2shell
      containers:
        - name: react2shell
          image: docker.io/simonangelfong/react2shell:insecure
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # container level crown jewel(RCE-reachable).
            - name: CONTAINER_SECRET
              valueFrom:
                secretKeyRef:
                  name: container-secret
                  key: password
          resources:
            requests:
              cpu: 512m
              memory: 512Mi
            limits:
              cpu: 1024m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: react2shell
  namespace: react
  labels:
    app: react2shell
spec:
  selector:
    app: react2shell
  ports:
    - name: http
      port: 3000
      targetPort: 3000
