# Shared Gateway -> one ALB, fronted by Cloudflare.
#
# Lives in its own namespace rather than alongside the app so a single
# ALB can serve routes from several namespaces (insecure/secure
# frontends) instead of provisioning one ALB each.
#
# allowedRoutes.namespaces.from: Selector restricts which namespaces
# may attach: a route in an unlabelled namespace is rejected, so a
# compromised pod elsewhere cannot publish itself on this hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: alb
  namespace: argocd
spec:
  gatewayClassName: alb

  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: alb-cloudflare

  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: react2shell-insecure.arguswatcher.net
      # No tls: block. The ALB certificate comes from the
      # LoadBalancerConfiguration (defaultCertificate), which is the
      # LBC-native path -- setting tls.mode: Terminate here would
      # require a certificateRefs secret that does not exist.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
