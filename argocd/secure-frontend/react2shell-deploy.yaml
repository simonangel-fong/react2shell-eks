# insecure app: react2shell
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react2shell
  namespace: secure-frontend
  labels:
    app: react2shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react2shell
  template:
    metadata:
      labels:
        app: react2shell
    spec:
      serviceAccountName: react2shell
      # pod-level hardening (satisfies PSS "restricted")
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: react2shell
          image: docker.io/simonangelfong/react2shell:secure-fb0da05353d8693ea906c37d1776c4a4b4470df2s
          imagePullPolicy: Always
          # container-level hardening
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true   # Next.js writes .next/cache -> see writable mount below
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          env:
            # container level crown jewel(RCE-reachable).
            - name: CONTAINER_SECRET
              valueFrom:
                secretKeyRef:
                  name: container-secret
                  key: password
          resources:
            requests:
              cpu: 512m
              memory: 512Mi
            limits:
              cpu: 1024m
              memory: 1024Mi
          # writable paths needed because the root fs is read-only.
          # app runs `npm run dev` (Next.js dev mode) which rewrites all of
          # .next/ at runtime, so the whole dir must be writable.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next
              mountPath: /app/.next
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next
          emptyDir: {}