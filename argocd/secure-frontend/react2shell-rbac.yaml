# rbac: sa - react2shell
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: react2shell
  namespace: secure-frontend
---
# role: insecure
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: react2shell
  namespace: secure-frontend
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: react2shell
  namespace: secure-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: react2shell
subjects:
  - kind: ServiceAccount
    name: react2shell
    namespace: secure-frontend
