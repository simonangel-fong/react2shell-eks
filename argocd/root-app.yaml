# App-of-apps root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 01-root-app
  namespace: argocd
  finalizers:
   - argocd.argoproj.io/resources-finalizer

spec:
  project: default
  source:
    repoURL: https://github.com/simonangel-fong/react2shell-eks.git
    targetRevision: master
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
