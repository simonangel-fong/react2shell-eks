# rbac: sa - react2shell
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: react2shell
  namespace: insecure-frontend
  annotations:
    # MISCONFIG (phase 9): IRSA binding to the broad admin role.
    # Role created in infra/eks/09_irsa.tf. ArgoCD owns this SA, so the
    # annotation must live here (git) — not patched by terraform.
    eks.amazonaws.com/role-arn: arn:aws:iam::099139718958:role/react2shell-eks-dev-pod-irsa
---
# role: insecure
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: react2shell
  namespace: insecure-frontend
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: react2shell
  namespace: insecure-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: react2shell
subjects:
  - kind: ServiceAccount
    name: react2shell
    namespace: insecure-frontend
---
# clusterrole: permissive
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: react2shell
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets","namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: react2shell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: react2shell
subjects:
  - kind: ServiceAccount
    name: react2shell
    namespace: insecure-frontend
