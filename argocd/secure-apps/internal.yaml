---
apiVersion: v1
kind: Namespace
metadata:
  name: internal
---
# Cluster level crown jewel
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secret
  namespace: internal
type: Opaque
stringData:
  password: "cLuSTer-SecReT"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-api-conf
  namespace: internal
data:
  default.conf: |
    server {
        listen 3000;

        location /api/v1/healthz {
            default_type application/json;
            return 200 '{"status":"healthy","message":"Service is running"}';
        }

        location /api/v1/users {
            default_type application/json;
            return 200 '[{"id":1,"name":"Alice"},{"id":2,"name":"Bob"}]';
        }

        location / {
            return 404 '{"error":"Not Found"}';
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-api
  namespace: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-api
  template:
    metadata:
      labels:
        app: internal-api
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: internal-api-conf
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 3000 # in the range of 1025–65535 to enable pod-to-pod
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 64m
              memory: 128Mi
            limits:
              cpu: 128m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: internal-api
  namespace: internal
  labels:
    app: internal-api
spec:
  selector:
    app: internal-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
