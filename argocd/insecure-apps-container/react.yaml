---
apiVersion: v1
kind: Namespace
metadata:
  name: react
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Container level crown jewel
apiVersion: v1
kind: Secret
metadata:
  name: container-secret
  namespace: react
type: Opaque
stringData:
  password: "CoNtAinEr-sEcRet-InsECurE"
---
# insecure app: react2shell
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react2shell
  namespace: react
  labels:
    app: react2shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react2shell
  template:
    metadata:
      labels:
        app: react2shell
    spec:
      serviceAccountName: react2shell
      # pod-level hardening (satisfies PSS "restricted")
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: react2shell
          image: docker.io/simonangelfong/react2shell:insecure
          imagePullPolicy: Always
          # container-level hardening
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          env:
            # container level crown jewel(RCE-reachable).
            - name: CONTAINER_SECRET
              valueFrom:
                secretKeyRef:
                  name: container-secret
                  key: password
          resources:
            requests:
              cpu: 512m
              memory: 512Mi
            limits:
              cpu: 1024m
              memory: 1024Mi
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: react2shell
  namespace: react
  labels:
    app: react2shell
spec:
  selector:
    app: react2shell
  ports:
    - name: http
      port: 3000
      targetPort: 3000
