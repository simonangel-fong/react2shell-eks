# insecure app: react2shell
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react2shell-insecure
  namespace: insecure
  labels:
    app: react2shell-insecure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react2shell-insecure
  template:
    metadata:
      labels:
        app: react2shell-insecure
    spec:
      serviceAccountName: react2shell
      containers:
        - name: react2shell-insecure
          image: docker.io/simonangelfong/react2shell:insecure
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # container level crown jewel(RCE-reachable).
            - name: CONTAINER_SECRET
              valueFrom:
                secretKeyRef:
                  name: container-secret
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi