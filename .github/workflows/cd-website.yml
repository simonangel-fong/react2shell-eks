# the WEBSITE: check the app and the terraform stack, then apply and publish on master.
name: cd-website

on:
  pull_request:
    paths:
      - "website/**"
      - "infra/project/**"
      - ".github/workflows/cd-website.yml"
  push:
    branches:
      - master
    paths:
      - "website/**"
      - "infra/project/**"
      - ".github/workflows/cd-website.yml"

  workflow_dispatch: # manual trigger for demos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_DIR: infra/project

jobs:
  # ##############################
  # 1. website app
  # ##############################
  website:
    name: check website app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: install (lockfile-exact)
        working-directory: website
        run: npm ci --ignore-scripts # no postinstall code execution

      - name: build
        working-directory: website
        run: npm run build

      - name: dependency CVEs (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: website
          scanners: vuln,secret
          skip-dirs: "website/node_modules,website/dist"
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Handed to the publish job so the artifact that was scanned is the one
      # that ships, rather than a second build.
      - name: upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          retention-days: 1

  # ##############################
  # 2. terraform checks
  # ##############################
  terraform:
    name: check terraform (project)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: fmt check
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive

      - name: validate
        run: |
          terraform -chdir=${{ env.TF_DIR }} init -backend=false -input=false
          terraform -chdir=${{ env.TF_DIR }} validate

      - name: trivy config (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/project
          skip-dirs: "**/.terraform"
          format: sarif
          output: trivy-iac-project.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-iac-project.sarif
          category: trivy-iac-project

      - name: trivy config (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/project
          skip-dirs: "**/.terraform"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: trivy secret scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: infra/project
          skip-dirs: "**/.terraform"
          scanners: secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ##############################
  # 3. apply (master only)
  # ##############################
  apply:
    name: terraform apply
    needs: [website, terraform]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: init
        run: |
          terraform -chdir=${{ env.TF_DIR }} init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: apply
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_tf_state_key: ${{ vars.TF_STATE_KEY }}
        run: terraform -chdir=${{ env.TF_DIR }} apply -auto-approve -input=false

  # ##############################
  # 4. publish (master only)
  # ##############################
  publish:
    name: publish website
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEPLOY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets are immutable; index.html must not be cached or a deploy
      # keeps serving the previous bundle. videos/ is not part of the build.
      - name: sync assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" \
            --delete --exclude "videos/*" --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: sync index.html
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --content-type "text/html" --cache-control "no-cache"

      - name: invalidate cdn
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
