name: lint-manifest

# Scan k8s manifests for policy violations and misconfig before merge.
on:
  pull_request:
    paths:
      - "argocd/**"
      - ".github/workflows/lint-manifest.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kyverno:
    # shift-left the admission image policy: a Pod using a bad image fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install kyverno cli
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.19.1   # ValidatingPolicy (policies.kyverno.io/v1) needs >=1.17
      - name: apply image policy to pod manifests
        # NOTE: scan only Pod-bearing manifests, not the whole argocd tree —
        # the CEL ValidatingPolicy CLI errors when CRDs (Argo/Kyverno) are in
        # the resource set (kyverno/kyverno#15949).
        run: |
          kyverno apply argocd/platform/kyverno-image-policy.yaml \
            --resource argocd/secure-frontend/react2shell-deploy.yaml \
            --resource argocd/insecure-frontend/react2shell-deploy.yaml

  misconfig:
    # generic k8s misconfig (privileged, no limits, runAsNonRoot, etc.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: argocd
          exit-code: "1"
          severity: HIGH,CRITICAL
