# the CONTAINER & CLUSTER layer: scan manifests
name: ci-manifest

on:
  pull_request:
    paths:
      - "argocd/secure-apps/**"
      - "argocd/platform/**"
      - ".github/workflows/ci-manifest.yml"
  push:
    branches: [master]
    paths:
      - "argocd/secure-apps/**"
      - "argocd/platform/**"
      - ".github/workflows/ci-manifest.yml"

  workflow_dispatch: # manual
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: k8s manifest misconfig
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scan manifests
      - name: trivy config (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: argocd/secure-apps
          format: sarif
          output: trivy-manifest.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-manifest.sarif
          category: trivy-manifest

      - name: trivy config (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: argocd/secure-apps/react.yaml
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
