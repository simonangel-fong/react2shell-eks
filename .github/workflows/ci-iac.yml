name: ci-iac

# Shift-left gate #4 - the CLOUD layer.
# Terraform misconfig + hardcoded secrets before any plan/apply.
# Consumes the per-stack .trivyignore files (accepted lab-only findings).
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/ci-iac.yml"
  push:
    branches: [master]
    paths:
      - "infra/**"
      - ".github/workflows/ci-iac.yml"

  workflow_dispatch: # manual trigger for demos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        stack: [eks-secure, eks-insecure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: fmt check
        run: terraform -chdir=infra/${{ matrix.stack }} fmt -check -recursive

      - name: validate
        run: |
          terraform -chdir=infra/${{ matrix.stack }} init -backend=false -input=false
          terraform -chdir=infra/${{ matrix.stack }} validate

      - name: trivy config (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/${{ matrix.stack }}
          trivyignores: infra/${{ matrix.stack }}/.trivyignore
          format: sarif
          output: trivy-iac-${{ matrix.stack }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-iac-${{ matrix.stack }}.sarif
          category: trivy-iac-${{ matrix.stack }}

      # eks-insecure is a deliberately vulnerable teaching stack: report, never gate.
      # eks-secure is the real target: gate hard.
      - name: trivy config (gate)
        if: matrix.stack == 'eks-secure'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/eks-secure
          trivyignores: infra/eks-secure/.trivyignore
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: trivy secret scan (gate, both stacks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: infra/${{ matrix.stack }}
          scanners: secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
