# the CLOUD layer: scan Terraform
name: ci-iac

on:
  pull_request:
    paths:
      - "infra/eks-secure/**"
      - ".github/workflows/ci-iac.yml"
  push:
    branches:
      - master
    paths:
      - "infra/eks-secure/**"
      - ".github/workflows/ci-iac.yml"

  workflow_dispatch: # manual trigger for demos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (eks-secure)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: fmt check
        run: terraform -chdir=infra/eks-secure fmt -check -recursive

      - name: validate
        run: |
          terraform -chdir=infra/eks-secure init -backend=false -input=false
          terraform -chdir=infra/eks-secure validate

      - name: trivy config (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/eks-secure
          trivyignores: infra/eks-secure/.trivyignore
          format: sarif
          output: trivy-iac-eks-secure.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-iac-eks-secure.sarif
          category: trivy-iac-eks-secure

      # scan config
      - name: trivy config (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/eks-secure
          trivyignores: infra/eks-secure/.trivyignore
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      # scan secret
      - name: trivy secret scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: infra/eks-secure
          scanners: secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
