# the CODE layer: scan image; SBOM
name: ci-image

on:
  pull_request:
    paths:
      - "app/react2shell-secure/**"
      - "app/Dockerfile.secure"
      - "app/.dockerignore"
      - "app/.trivyignore"
      - ".github/workflows/ci-image.yml"
  push:
    branches: 
      - master
    paths:
      - "app/react2shell-secure/**"
      - "app/Dockerfile.secure"
      - "app/.dockerignore"
      - "app/.trivyignore"
      - ".github/workflows/ci-image.yml"

  workflow_dispatch: # manuals

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/simonangelfong/react2shell
  TAG: secure-${{ github.sha }}

jobs:
  dockerfile-lint:
    name: Dockerfile misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches root USER, :latest base, missing pinning - before any build cost.
      - name: trivy config - Dockerfile.secure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: app/Dockerfile.secure
          trivyignores: app/.trivyignore
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  build-scan:
    name: build, scan, SBOM
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Single build. Output is an OCI tarball
      - name: build image (once)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          file: app/Dockerfile.secure
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # scan image
      - name: trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scanners: vuln
          trivyignores: app/.trivyignore
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # gate
      - name: trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scanners: vuln
          trivyignores: app/.trivyignore
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Supply chain: SBOM of the exact scanned image
      - name: generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scan-type: image
          format: cyclonedx
          output: sbom.cdx.json

      - name: upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ env.TAG }}
          path: sbom.cdx.json
          retention-days: 30

  push:
    name: push (master only)
    needs: build-scan
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          file: app/Dockerfile.secure
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: mode=max # SLSA attestation
          sbom: true
          cache-from: type=gha

      - name: report digest
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
