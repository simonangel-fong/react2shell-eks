name: build-image

# Build, test, and scan the SECURE app image. Push only on master, scan-clean.
on:
  pull_request:
    paths:
      - "app/react2shell-secure/**"
      - "app/Dockerfile.secure"
      - "app/.trivyignore"
      - ".github/workflows/build-image.yml"
  push:
    branches:
      - master
    paths:
      - "app/react2shell-secure/**"
      - "app/Dockerfile.secure"
      - "app/.trivyignore"
      - ".github/workflows/build-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/simonangelfong/react2shell

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # --- app build ---
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/react2shell-secure/package-lock.json
      - name: install
        working-directory: app/react2shell-secure
        run: npm ci
      - name: build
        working-directory: app/react2shell-secure
        run: npm run build
      # - name: test        # no test script yet; add when present
      #   working-directory: app/react2shell-secure
      #   run: npm test

      # --- image build (Buildx + GHA layer cache), load locally, do NOT push yet ---
      - uses: docker/setup-buildx-action@v4

      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile.secure
          load: true
          tags: ${{ env.IMAGE }}:secure-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- gate: Trivy image scan, fail on HIGH/CRITICAL ---
      # app/.trivyignore holds accepted base-image / Next-vendored CVEs.
      - name: trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:secure-${{ github.sha }}
          scanners: vuln
          trivyignores: app/.trivyignore
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # --- push only on master, only after the scan passes ---
      - name: login to registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: push image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile.secure
          push: true
          tags: ${{ env.IMAGE }}:secure-${{ github.sha }}
          cache-from: type=gha
